# Baton's infrastructure — the app database and Keycloak (staff sign-in) — and, with the "app" profile,
# Baton itself as containers (API + web).
#
#   npm run infra:up      database + Keycloak only (run the API and web app from source: npm run api / dev)
#   npm run app:up        everything in Docker: database, Keycloak, API, web   → http://localhost:5173
#   npm run app:ingest    build the knowledge index into the data volume (first run: about an hour on a CPU)
#   npm run infra:down    stop (data is kept in the Docker volumes)
#
# Keycloak  http://localhost:8080   admin console login: KEYCLOAK_ADMIN_USER / KEYCLOAK_ADMIN_PASSWORD
# Postgres  localhost:5433          database "baton" (app) and "keycloak" (identity), one server
# Mailpit   http://localhost:8025   catches the app's emails (alerts, replies to customers who left)
# Vault     http://localhost:8200   the API's secrets (root token: infra/vault/local/init.txt — keep it private)
#
# The realm in keycloak/import/ is imported on the FIRST start only. To re-import after editing it,
# delete the data: `docker compose --env-file .env -f infra/docker-compose.yml down -v` (destroys users,
# conversations and settings).

name: baton

services:
  db:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: ${BATON_DB_PASSWORD:?set in .env}
      POSTGRES_DB: baton
      # Read by postgres/init/01-keycloak.sh to create Keycloak's own database and user.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:${BATON_DB_PORT:-5433}:5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baton -d baton']
      interval: 3s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    # start-dev: HTTP, no theme caching — fine on localhost. Use `start` with TLS in production.
    command: start-dev --import-realm
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      # Fixed public URL, so token issuers match what the browser and the API both see.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HEALTH_ENABLED: 'true'
      # Placeholders in keycloak/import/baton-realm.json
      BATON_WEB_URL: ${BATON_WEB_URL:-http://localhost:5173}
      BATON_DEMO_PASSWORD: ${BATON_DEMO_PASSWORD:?set in .env}
      BATON_API_ADMIN_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set in .env}
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8080}:8080
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; ask the management port with bash's /dev/tcp.
      test: ['CMD-SHELL', "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The API's secrets (Groq key, widget secrets, …). A real server with on-disk storage, not -dev mode;
  # vault-init unseals it and sets it up on every start. Infra passwords (database, Keycloak) stay in .env:
  # Docker needs them to start those services before Vault is up.
  vault:
    image: docker.io/hashicorp/vault:1.20
    restart: unless-stopped
    command: server
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - 127.0.0.1:${VAULT_PORT:-8200}:8200
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data:/vault/file
    healthcheck:
      test: ['CMD-SHELL', 'vault status >/dev/null 2>&1; [ $$? -ne 1 ]']  # up (sealed or not)
      interval: 3s
      timeout: 3s
      retries: 20

  vault-init:
    image: docker.io/hashicorp/vault:1.20
    depends_on:
      vault: { condition: service_healthy }
    entrypoint: ["sh", "/vault/init.sh"]
    env_file: ../.env  # the first time, the API's secrets are copied from here into Vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_SEED: ${VAULT_SEED:-}
    volumes:
      - ./vault/init.sh:/vault/init.sh:ro
      - ./vault/policies:/vault/policies:ro
      - ./vault/local:/vault/local  # init.txt (unseal key + root token) and the API's AppRole credentials

  # Catches every email the app sends (alerts to agents, replies to customers) in a web inbox — nothing
  # leaves your machine. Point SMTP_* at a real provider in production.
  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025   # inbox: http://localhost:8025
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025 # SMTP for the API run from source

  # ── Baton as containers (profile "app") ─────────────────────────────────────────────────────────
  api:
    profiles: [app]
    build: { context: .., dockerfile: backend/Dockerfile }
    image: baton-api:local
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    env_file: ../.env  # settings; secrets come from Vault (below), which overrides any left in .env
    environment:
      DATABASE_URL: postgresql://baton:${BATON_DB_PASSWORD}@db:5432/baton
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}  # what browsers see: the tokens' issuer
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080            # how the API reaches Keycloak inside Docker
      CORS_ORIGIN: ${BATON_WEB_URL:-http://localhost:5173}
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /vault/local/role_id
      VAULT_SECRET_ID_FILE: /vault/local/secret_id
      SMTP_HOST: ${SMTP_DOCKER_HOST:-mailpit}               # Mailpit inside Docker; set SMTP_DOCKER_HOST for a real server
      SMTP_PORT: ${SMTP_DOCKER_PORT:-1025}
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_URL:-http://host.docker.internal:3000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - 127.0.0.1:${BATON_API_PORT:-8787}:8787
    volumes:
      - baton_data:/app/data        # knowledge index + embedding models (npm run app:ingest)
      - baton_content:/app/content  # your help-centre articles, incl. ones published from the review queue
      - ./vault/local:/vault/local:ro  # the API's AppRole credentials, written by vault-init

  web:
    profiles: [app]
    build: { context: .., dockerfile: frontend/Dockerfile }
    image: baton-web:local
    restart: unless-stopped
    depends_on: [api]
    environment:
      # Public settings for the browser, applied at start-up (see frontend/docker/40-baton-config.sh).
      VITE_API_URL: http://localhost:${BATON_API_PORT:-8787}
      VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      VITE_KEYCLOAK_REALM: baton
      VITE_KEYCLOAK_CLIENT_ID: baton-web
      WIDGET_FRAME_ANCESTORS: ${WIDGET_FRAME_ANCESTORS:-*}  # sites allowed to embed the chat widget
    ports:
      - 127.0.0.1:${BATON_WEB_PORT:-5173}:8080

  ingest:
    profiles: [tools]  # run on demand: npm run app:ingest
    image: baton-api:local
    env_file: ../.env
    command: ["baton-ingest"]
    volumes:
      - baton_data:/app/data
      - baton_content:/app/content

volumes:
  db_data:
  vault_data:
  baton_data:
  baton_content:
