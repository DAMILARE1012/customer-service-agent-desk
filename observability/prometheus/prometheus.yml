# The API is scraped every 2 s and the dashboard refreshes every 3 s, so a change shows within ~5 s.
# Alert rules use fixed windows (minutes) and are checked every 5 s.
global:
  scrape_interval: 15s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The support API (npm run server) on the host machine.
  - job_name: baton-api
    scrape_interval: 2s
    scrape_timeout: 2s
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8787']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
