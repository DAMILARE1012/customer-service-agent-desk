global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The support API (npm run server) on the host machine.
  - job_name: support-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8787']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
